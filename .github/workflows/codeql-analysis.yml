name: CodeQL
on:
    push:
        branches: [main, dev]
    pull_request:
    schedule:
        - cron: '45 10 * * 0'
permissions:
    contents: read
jobs:
    analyze:
        runs-on: ubuntu-latest
        permissions:
            security-events: write
        steps:
            - uses: actions/checkout@v7.0.1
            - uses: actions/setup-go@v7.0.0
              with:
                  go-version-file: go.mod
            - uses: github/codeql-action/init@v4.38.1
              with:
                  languages: go
                  build-mode: manual
            - run: go build ./...
            - uses: github/codeql-action/analyze@v4.38.1
